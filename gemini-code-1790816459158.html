<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>급식실 스마트 현황판</title>
  <style>
    /* 트렌디한 감성 컬러 팔레트 정의 */
    :root {
      --bg-app: #f8faf9;
      --surface: #ffffff;
      --primary: #2e7d32;
      --primary-light: #e8f5e9;
      --accent: #ff8f00;
      --accent-light: #fff8e1;
      --danger: #e53935;
      --danger-light: #ffebee;
      --text-primary: #1e293b;
      --text-secondary: #64748b;
      --border: #f1f5f9;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f1f5f9; color: var(--text-primary); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }

    /* 앱 프레임 컨테이너 */
    .app-container {
      width: 100%;
      max-width: 440px;
      height: 840px;
      background-color: var(--bg-app);
      border-radius: 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      border: 6px solid #ffffff;
    }

    /* 앱 상단 헤더 */
    .app-header {
      background: var(--surface);
      padding: 20px 24px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }
    .app-title { font-size: 1.15rem; font-weight: 700; color: var(--text-primary); }
    .status-badge {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      background: var(--primary-light);
      color: var(--primary);
    }

    /* 앱 메인 콘텐츠 영역 (단계별 화면) */
    .app-content {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      position: relative;
    }
    
    .screen {
      display: none;
      animation: fadeIn 0.25s ease-in-out;
    }
    .screen.active { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 공통 카드 디자인 */
    .card {
      background: var(--surface);
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }
    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* 1단계: 메인 현황 화면 */
    .wait-banner {
      background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .wait-time { font-size: 1.5rem; font-weight: 800; color: var(--primary); }

    .seat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .seat {
      aspect-ratio: 1;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 700;
      transition: all 0.2s;
    }
    .seat.available { background: var(--primary-light); color: var(--primary); }
    .seat.occupied { background: var(--danger-light); color: var(--danger); }

    /* 2단계: 식단 보기 화면 */
    .meal-toggle {
      display: flex;
      background: #f1f5f9;
      padding: 4px;
      border-radius: 14px;
      margin-bottom: 16px;
    }
    .meal-toggle button {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--text-secondary);
      background: transparent;
      cursor: pointer;
    }
    .meal-toggle button.active {
      background: var(--surface);
      color: var(--text-primary);
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }
    .menu-item {
      display: flex;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px dashed var(--border);
      font-size: 0.9rem;
    }
    .menu-item:last-child { border-bottom: none; }

    /* 3단계: AI 도우미 화면 */
    .chat-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: 480px;
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 0.85rem;
      line-height: 1.4;
    }
    .message.ai {
      background: var(--surface);
      color: var(--text-primary);
      border-bottom-left-radius: 4px;
      box-shadow: var(--shadow);
    }
    .message.user {
      background: var(--primary);
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    .quick-questions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .chip {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      color: var(--text-secondary);
      cursor: pointer;
    }

    /* 하단 네비게이션 바 (앱 탭 바) */
    .bottom-nav {
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 10px 0 20px;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      border: none;
      background: none;
      color: var(--text-secondary);
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      width: 33.3%;
    }
    .nav-item .icon { font-size: 1.2rem; }
    .nav-item.active { color: var(--primary); }
  </style>
</head>
<body>

<div class="app-container">
  <!-- 앱 헤더 -->
  <header class="app-header">
    <div>
      <div class="app-title">중앙 급식실</div>
      <small id="clock" style="font-size: 0.7rem; color: var(--text-secondary);"></small>
    </div>
    <span class="status-badge">● 원활</span>
  </header>

  <!-- 메인 스크린 영역 -->
  <main class="app-content">
    
    <!-- STEP 1: 실시간 좌석 및 대기 화면 -->
    <section id="screen-seats" class="screen active">
      <div class="wait-banner">
        <div>
          <div style="font-size: 0.8rem; color: var(--text-secondary);">현재 예상 대기시간</div>
          <div class="wait-time">약 5분</div>
        </div>
        <div style="text-align: right; font-size: 0.8rem; color: var(--text-secondary);">
          대기인원<br><strong style="font-size: 1.1rem; color: var(--text-primary);">6명</strong>
        </div>
      </div>

      <div class="card">
        <div class="card-title">
          <span>좌석 배치도</span>
          <span style="font-size: 0.75rem; font-weight: normal; color: var(--text-secondary);">
            🟢 이용가능(18) 🔴 사용중(14)
          </span>
        </div>
        <div class="seat-grid" id="seat-grid">
          <!-- JS로 동적 생성 -->
        </div>
      </div>
    </section>

    <!-- STEP 2: 오늘의 식단 화면 -->
    <section id="screen-menu" class="screen">
      <div class="meal-toggle">
        <button class="active" onclick="switchMeal('lunch')">중식 (11:30~13:30)</button>
        <button onclick="switchMeal('dinner')">석식 (17:30~19:00)</button>
      </div>

      <div class="card">
        <div class="card-title">
          <span id="meal-title">오늘의 중식 메뉴</span>
          <span style="font-size: 0.75rem; color: var(--accent); font-weight: normal;">680 kcal</span>
        </div>
        <div id="menu-list-container">
          <!-- JS로 메뉴 리스트 동적 표시 -->
        </div>
      </div>
    </section>

    <!-- STEP 3: AI 도우미 화면 -->
    <section id="screen-ai" class="screen">
      <div class="chat-box">
        <div class="chat-messages" id="chat-messages">
          <div class="message ai">안녕하세요! 급식실에 대해 궁금한 점을 편하게 물어보세요.</div>
        </div>
        <div class="quick-questions">
          <div class="chip" onclick="askAI('여유로운 시간대는 언제인가요?')">⏰ 여유로운 시간</div>
          <div class="chip" onclick="askAI('오늘 알레르기 유발 정보 알려줘')">⚠️ 알레르기 정보</div>
          <div class="chip" onclick="askAI('퇴식구 위치가 어디인가요?')">🥣 퇴식구 위치</div>
        </div>
      </div>
    </section>

  </main>

  <!-- 하단 탭 바 (여러 단계 이동) -->
  <nav class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('seats', this)">
      <span class="icon">🪑</span>
      <span>좌석현황</span>
    </button>
    <button class="nav-item" onclick="switchTab('menu', this)">
      <span class="icon">🍱</span>
      <span>오늘식단</span>
    </button>
    <button class="nav-item" onclick="switchTab('ai', this)">
      <span class="icon">🤖</span>
      <span>AI도우미</span>
    </button>
  </nav>
</div>

<script>
  // 시계
  function updateClock() {
    const now = new Date();
    document.getElementById('clock').innerText = now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
  }
  setInterval(updateClock, 1000);
  updateClock();

  // 탭 전환 (여러 단계 구조)
  function switchTab(screenId, btnElement) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));

    document.getElementById(`screen-${screenId}`).classList.add('active');
    btnElement.classList.add('active');
  }

  // 좌석 배치도 생성 (32개)
  const seatGrid = document.getElementById('seat-grid');
  for (let i = 1; i <= 32; i++) {
    const seat = document.createElement('div');
    const isOccupied = Math.random() < 0.45;
    seat.className = `seat ${isOccupied ? 'occupied' : 'available'}`;
    seat.innerText = i;
    seatGrid.appendChild(seat);
  }

  // 식단 메뉴 데이터 및 스위치
  const menuData = {
    lunch: ["현미 찹쌀밥", "바삭 돈카츠 & 브라운 소스", "미소 팽이버섯 장국", "마카로니 콘샐러드", "수제 포기김치"],
    dinner: ["차돌박이 비빔밥", "맑은 계란 파국", "바삭 떡꼬치", "아삭 깍두기", "청포도 에이드"]
  };

  function switchMeal(type) {
    const buttons = document.querySelectorAll('.meal-toggle button');
    buttons.forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');

    const container = document.getElementById('menu-list-container');
    const title = document.getElementById('meal-title');

    title.innerText = type === 'lunch' ? '오늘의 중식 메뉴' : '오늘의 석식 메뉴';
    container.innerHTML = menuData[type].map(item => `
      <div class="menu-item">
        <span style="color: var(--primary); margin-right: 8px;">•</span> ${item}
      </div>
    `).join('');
  }
  switchMeal('lunch'); // 초기 실행

  // AI 챗봇
  function askAI(question) {
    const messages = document.getElementById('chat-messages');
    
    // 사용자 질문
    const uMsg = document.createElement('div');
    uMsg.className = 'message user';
    uMsg.innerText = question;
    messages.appendChild(uMsg);

    // 답변 로직
    let reply = "죄송해요, 다시 질문해주시겠어요?";
    if (question.includes('시간')) reply = "12:40 이후 또는 18:10 이후에 방문하시면 대기 없이 한적하게 이용하실 수 있습니다.";
    if (question.includes('알레르기')) reply = "오늘 중식에는 대두, 돼지고기, 밀이 포함되어 있습니다. 알레르기가 있으신 분은 유의해 주세요.";
    if (question.includes('퇴식구')) reply = "퇴식구는 출입구 반대편(좌석 30~32번 구역 옆)에 위치해 있습니다.";

    setTimeout(() => {
      const aMsg = document.createElement('div');
      aMsg.className = 'message ai';
      aMsg.innerText = reply;
      messages.appendChild(aMsg);
      messages.scrollTop = messages.scrollHeight;
    }, 250);
  }
</script>

</body>
</html>
